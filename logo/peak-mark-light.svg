<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PEAK">
  <title>PEAK</title>
  <!-- Light-background build. The snow is a pale cool blue rather than white:
       the cap sits at the apex and very slightly overhangs the silhouette, so
       pure white on a white page reads as a hole punched out of the summit
       instead of snow sitting on it. -->
  <path d="M16 400 L176 112 L264 264 L304 208 L496 400 Z" fill="#33445c"/>
  <path d="M176 112 L217.6 184 L176 212.8 L134.4 184 Z" fill="#d3dfee"/>
  <path d="M304 208 L332.8 256 L304 275.2 L275.2 256 Z" fill="#b4c5db"/>
  <path d="M176 112 L320 216" fill="none" stroke="#16a34a" stroke-width="20"
        stroke-dasharray="32 32" stroke-linecap="round"/>
</svg>
